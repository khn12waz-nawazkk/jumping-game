<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jumping Adventure</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #087bd5;
  color: white;
  text-align: center;
}
header { padding: 14px 8px 5px; }
h1 {
  margin: 4px;
  font-size: clamp(25px, 5vw, 42px);
  color: #ffe34d;
  text-shadow: 3px 4px #174d89;
}
.subtitle { margin: 5px; font-size: 14px; }
.game-wrap {
  width: min(96%, 950px);
  margin: 10px auto;
  position: relative;
}
canvas {
  display: block;
  width: 100%;
  aspect-ratio: 900 / 450;
  background: #65d3ff;
  border: 4px solid white;
  border-radius: 16px;
  box-shadow: 0 8px 25px #003d6b88;
  touch-action: manipulation;
}
.hud {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin: 8px 0;
  font-weight: bold;
}
.hud span {
  background: #074d86;
  border: 2px solid #76e4ff;
  padding: 9px 14px;
  border-radius: 12px;
}
.buttons {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  margin: 12px;
}
button {
  border: 3px solid white;
  border-radius: 15px;
  padding: 12px 24px;
  color: white;
  background: #13b957;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px #087b38;
}
button:active { transform: translateY(3px); box-shadow: none; }
#restart { background: #168ce0; box-shadow: 0 4px #07579b; }
#jump { background: #ff9b21; box-shadow: 0 4px #a95700; }
.help { padding: 0 10px 18px; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>🏆 JUMPING ADVENTURE</h1>
  <p class="subtitle">Jump high, avoid obstacles and beat your best score!</p>
</header>

<div class="game-wrap">
  <div class="hud">
    <span>⭐ SCORE: <b id="score">0</b></span>
    <span>🏆 BEST: <b id="best">0</b></span>
  </div>
  <canvas id="game" width="900" height="450"></canvas>
</div>

<div class="buttons">
  <button id="start">▶ START GAME</button>
  <button id="restart">↻ RESTART</button>
  <button id="jump">⬆ JUMP!</button>
</div>

<p class="help">Computer: SPACE or ↑ to jump. Mobile: tap JUMP or tap the game.</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreText = document.getElementById("score");
const bestText = document.getElementById("best");

let best = 0;
try { best = Number(localStorage.getItem("jumpAdventureBest")) || 0; }
catch(e) {}
bestText.textContent = best;

let running = false;
let gameOver = false;
let score = 0;
let frame = 0;
let speed = 5;
let obstacles = [];
let clouds = [{x:100,y:65,s:1},{x:410,y:105,s:.8},{x:730,y:60,s:1.2}];

const groundY = 365;
const player = { x: 115, y: groundY-76, w: 48, h: 76, vy: 0, jumping: false };

function roundedRect(x,y,w,h,r,color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
  ctx.fill();
}

function drawCloud(x,y,s) {
  ctx.fillStyle = "rgba(255,255,255,.9)";
  ctx.beginPath();
  ctx.arc(x,y,18*s,0,Math.PI*2);
  ctx.arc(x+22*s,y-12*s,25*s,0,Math.PI*2);
  ctx.arc(x+48*s,y,19*s,0,Math.PI*2);
  ctx.fill();
}

function drawBackground() {
  const sky = ctx.createLinearGradient(0,0,0,450);
  sky.addColorStop(0,"#48c6ff");
  sky.addColorStop(1,"#d3f7ff");
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,900,450);

  clouds.forEach(c => drawCloud(c.x,c.y,c.s));

  ctx.fillStyle = "#85d8a0";
  ctx.beginPath();
  ctx.moveTo(0,300);
  for(let x=0;x<=900;x+=90)
    ctx.lineTo(x,260+Math.sin(x*.018)*32);
  ctx.lineTo(900,365); ctx.lineTo(0,365); ctx.fill();

  ctx.fillStyle = "#54bd69";
  ctx.beginPath();
  ctx.moveTo(0,330);
  for(let x=0;x<=900;x+=60)
    ctx.lineTo(x,300+Math.sin(x*.025)*18);
  ctx.lineTo(900,365); ctx.lineTo(0,365); ctx.fill();

  ctx.fillStyle = "#4fc64d";
  ctx.fillRect(0,groundY,900,12);
  ctx.fillStyle = "#b97642";
  ctx.fillRect(0,groundY+12,900,85);

  ctx.fillStyle = "#94552f";
  for(let x=10;x<900;x+=65) {
    ctx.fillRect(x,groundY+35,28,7);
    ctx.fillRect(x+25,groundY+65,22,6);
  }
}

function drawCartoon(p) {
  const x=p.x, y=p.y;
  const bob = running && !p.jumping ? Math.sin(frame*.25)*2 : 0;
  ctx.save();
  ctx.translate(x,y+bob);

  // Shoes and legs
  ctx.strokeStyle="#174c9c";
  ctx.lineWidth=9;
  ctx.lineCap="round";
  ctx.beginPath();
  ctx.moveTo(20,53); ctx.lineTo(17,65);
  ctx.moveTo(34,53); ctx.lineTo(38,65);
  ctx.stroke();
  roundedRect(5,61,22,10,5,"#ef493e");
  roundedRect(29,61,22,10,5,"#ef493e");

  // Arms
  ctx.strokeStyle="#f4b27d";
  ctx.lineWidth=8;
  ctx.beginPath();
  ctx.moveTo(12,29); ctx.lineTo(2,40);
  ctx.moveTo(39,29); ctx.lineTo(49,37);
  ctx.stroke();

  // Red shirt and backpack
  roundedRect(10,23,31,34,9,"#ed443e");
  roundedRect(5,27,9,23,4,"#8048bd");
  ctx.strokeStyle="#ffb347";
  ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(15,28); ctx.lineTo(22,43);
  ctx.stroke();

  // Neck and face
  roundedRect(22,15,12,13,4,"#f2b47f");
  ctx.fillStyle="#f5bd87";
  ctx.beginPath(); ctx.ellipse(27,12,19,20,0,0,Math.PI*2); ctx.fill();

  // Hair
  ctx.fillStyle="#67351f";
  ctx.beginPath();
  ctx.moveTo(9,14);
  ctx.lineTo(8,4); ctx.lineTo(17,6);
  ctx.lineTo(22,-4); ctx.lineTo(30,3);
  ctx.lineTo(41,1); ctx.lineTo(46,13);
  ctx.lineTo(40,17); ctx.lineTo(15,16);
  ctx.closePath(); ctx.fill();

  // Eyes
  ctx.fillStyle="white";
  ctx.beginPath();
  ctx.ellipse(20,12,5,7,0,0,Math.PI*2);
  ctx.ellipse(34,12,5,7,0,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle="#263b5c";
  ctx.beginPath();
  ctx.arc(21,13,2.5,0,Math.PI*2);
  ctx.arc(34,13,2.5,0,Math.PI*2);
  ctx.fill();

  // Smile
  ctx.strokeStyle="#7b3029";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(28,17,7,.2,Math.PI-.2);
  ctx.stroke();

  ctx.restore();
}

function drawObstacle(o) {
  const x=o.x, y=groundY-o.h;
  // Friendly cartoon obstacle
  roundedRect(x,y,o.w,o.h,8,"#e84b4b");
  roundedRect(x-5,y+8, o.w+10,12,6,"#ff8b4f");
  ctx.fillStyle="white";
  ctx.beginPath();
  ctx.arc(x+12,y+22,5,0,Math.PI*2);
  ctx.arc(x+o.w-12,y+22,5,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle="#342f58";
  ctx.beginPath();
  ctx.arc(x+13,y+23,2.5,0,Math.PI*2);
  ctx.arc(x+o.w-11,y+23,2.5,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle="#702c39";
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(x+10,y+36); ctx.lineTo(x+o.w-10,y+36);
  ctx.stroke();
}

function overlay(title, message) {
  ctx.fillStyle="rgba(7,42,87,.64)";
  ctx.fillRect(0,0,900,450);
  roundedRect(190,130,520,165,22,"#07518b");
  ctx.strokeStyle="#fff";
  ctx.lineWidth=4;
  ctx.strokeRect(190,130,520,165);
  ctx.textAlign="center";
  ctx.fillStyle="#ffe34d";
  ctx.font="bold 48px Arial";
  ctx.fillText(title,450,195);
  ctx.fillStyle="white";
  ctx.font="bold 23px Arial";
  ctx.fillText(message,450,240);
  ctx.font="18px Arial";
  ctx.fillText("Press START GAME to play",450,270);
}

function resetGame() {
  score=0; frame=0; speed=5;
  obstacles=[];
  player.y=groundY-player.h;
  player.vy=0; player.jumping=false;
  scoreText.textContent="0";
  gameOver=false;
  running=true;
}

function jump() {
  if(!running) {
    if(gameOver) return;
    resetGame();
  }
  if(!player.jumping) {
    player.vy=-13.5;
    player.jumping=true;
  }
}

function endGame() {
  running=false;
  gameOver=true;
  if(score>best) {
    best=score;
    bestText.textContent=best;
    try { localStorage.setItem("jumpAdventureBest",best); }
    catch(e) {}
  }
}

function update() {
  if(!running) return;
  frame++;
  score=Math.floor(frame/5);
  scoreText.textContent=score;
  speed=5+Math.min(score/100,4);

  player.vy+=.58;
  player.y+=player.vy;
  if(player.y>=groundY-player.h) {
    player.y=groundY-player.h;
    player.vy=0;
    player.jumping=false;
  }

  if(frame%85===0) {
    const h=35+Math.random()*28;
    obstacles.push({x:920,w:30+Math.random()*12,h});
  }
  obstacles.forEach(o=>o.x-=speed);
  obstacles=obstacles.filter(o=>o.x+o.w>0);

  for(const o of obstacles) {
    const px=player.x+9, py=player.y+8;
    if(px+player.w-16>o.x && px<o.x+o.w &&
       py+player.h-8>groundY-o.h) {
      endGame();
      break;
    }
  }
  clouds.forEach(c=>{
    c.x-=.35*c.s;
    if(c.x<-80)c.x=950;
  });
}

function draw() {
  drawBackground();
  obstacles.forEach(drawObstacle);
  drawCartoon(player);

  if(!running && !gameOver)
    overlay("JUMPING ADVENTURE","Ready for an adventure?");
  if(gameOver)
    overlay("GAME OVER","Your score: "+score+"!");
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

document.getElementById("start").addEventListener("click",()=>{
  resetGame();
});
document.getElementById("restart").addEventListener("click",()=>{
  resetGame();
});
document.getElementById("jump").addEventListener("click",jump);
canvas.addEventListener("pointerdown",jump);

document.addEventListener("keydown",e=>{
  if(e.code==="Space" || e.code==="ArrowUp") {
    e.preventDefault();
    if(e.repeat) return;
    jump();
  }
});

draw();
loop();
</script>
</body>
</html>
